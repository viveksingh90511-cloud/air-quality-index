events { worker_connections 1024; }

http {
    upstream fastapi { server fastapi:8000; }
    upstream streamlit { server streamlit:8501; }
    upstream frontend { server frontend:80; }

    server {
        listen 80;
        server_name localhost;

        # React Frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # FastAPI Backend
        location /api/ {
            proxy_pass http://fastapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API Documentation
        location /docs { proxy_pass http://fastapi; }
        location /redoc { proxy_pass http://fastapi; }
        location /openapi.json { proxy_pass http://fastapi; }

        # Streamlit Dashboard
        location /streamlit/ {
            proxy_pass http://streamlit/;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Health Check
        location /health { proxy_pass http://fastapi; }

        # WebSocket support
        location /ws/ {
            proxy_pass http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
